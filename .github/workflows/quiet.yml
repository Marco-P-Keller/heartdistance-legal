name: Quiet

# Builds the iOS app and runs its tests on a real macOS machine with a real
# Xcode, because a project that has only ever been read is not a project that
# works. Only runs when something under the app actually changes.
on:
  push:
    paths:
      - 'breakthrough/Quiet/**'
      - '.github/workflows/quiet.yml'
  pull_request:
    paths:
      - 'breakthrough/Quiet/**'
      - '.github/workflows/quiet.yml'
  workflow_dispatch:

concurrency:
  group: quiet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: breakthrough/Quiet

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Booted here rather than left to xcodebuild, which boots in silence: a
      # first boot of a freshly installed Xcode can take minutes, and from
      # outside it is indistinguishable from a hang.
      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available \
            | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' \
            | sed 's/ *$//' \
            | head -1)
          if [ -z "$device" ]; then
            echo "No iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Booting $device"
          xcrun simctl boot "$device" || true
          time xcrun simctl bootstatus "$device" -b
          echo "device=$device" >> "$GITHUB_OUTPUT"

      # Split from the run below so that a slow compile and a stuck test are
      # two different lines in the log rather than one silence.
      - name: Build for testing
        run: |
          set -o pipefail
          time xcodebuild build-for-testing \
            -project Quiet.xcodeproj \
            -scheme Quiet \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 \
            | tee build.log \
            | sed "s|$GITHUB_WORKSPACE/||g" \
            | grep -E "error:|warning:|\*\* BUILD"

      - name: Test
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Quiet.xcodeproj \
            -scheme Quiet \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 \
            | tee -a build.log \
            | sed "s|$GITHUB_WORKSPACE/||g" \
            | grep -E "error:|Test Case|Executed |Test Suite .* (passed|failed)|\*\* TEST"

      # The full log is thousands of lines of module compilation. What anybody
      # actually needs after a red run is the handful of lines naming what
      # broke, in one place, without scrolling.
      - name: Digest
        if: always()
        run: |
          {
            echo "## Quiet"
            echo
            echo "### Errors"
            grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -40 || echo "None."
            echo
            echo "### Failed tests"
            grep -E "^Test Case .* failed" build.log | sort -u | head -40 || echo "None."
            echo
            echo "### Warnings"
            grep -E "warning:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -60 || echo "None."
            echo
            grep -E "^Executed [0-9]+ test" build.log | tail -2 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log and the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            breakthrough/Quiet/build.log
            breakthrough/Quiet/TestResults.xcresult
          retention-days: 7
