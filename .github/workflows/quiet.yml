name: Quiet

# Builds the iOS app and runs its tests on a real macOS machine with a real
# Xcode, because a project that has only ever been read is not a project that
# works. Only runs when something under the app actually changes.
on:
  push:
    paths:
      - 'breakthrough/Quiet/**'
      - '.github/workflows/quiet.yml'
  pull_request:
    paths:
      - 'breakthrough/Quiet/**'
      - '.github/workflows/quiet.yml'
  workflow_dispatch:

concurrency:
  group: quiet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: breakthrough/Quiet

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available \
            | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' \
            | sed 's/ *$//' \
            | head -1)
          if [ -z "$device" ]; then
            echo "No iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Testing on $device"
          echo "device=$device" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Quiet.xcodeproj \
            -scheme Quiet \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # Nothing here is allowed to fail quietly: if a warning appears in Quiet's
      # own sources, it is a thing somebody has to look at.
      - name: Report warnings
        if: always()
        run: |
          if grep -E "warning:" build.log > warnings.txt; then
            echo "### Warnings" >> "$GITHUB_STEP_SUMMARY"
            sort -u warnings.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            sort -u warnings.txt
          else
            echo "No warnings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: breakthrough/Quiet/TestResults.xcresult
          retention-days: 7
